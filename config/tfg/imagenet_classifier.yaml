# TFG Configuration: ImageNet Classifier Guidance
#
# This configuration sets up Training-Free Guidance using a pretrained
# ImageNet classifier (e.g., ResNet-50) to steer generation toward
# specific target classes.
#
# Usage:
#   uv run python experiments/tfg_inference.py \
#       --config config/tfg/imagenet_classifier.yaml \
#       --checkpoint output/.../checkpoint-last.pth \
#       --target_class 207  # Golden Retriever

# TFG Hyperparameters
# -------------------
# These control the strength and schedule of guidance

# Variance guidance strength (rho in TFG paper)
# Higher = stronger guidance at intermediate timesteps
# Recommended: 0.5 - 2.0
rho: 1.0

# Mean guidance strength (mu in TFG paper)
# Higher = stronger direct gradient on x_0 estimate
# Recommended: 0.3 - 1.0
mu: 0.5

# Recurrence steps (K in TFG paper)
# More steps = more refined guidance but slower
# Recommended: 1-3
recur_steps: 1

# Iteration steps for mean guidance
# More steps = better x_0 refinement
# Recommended: 1-2
iter_steps: 1

# Monte Carlo noise scale for smoothed guidance
# 0 = no smoothing (deterministic)
# > 0 = smoothed guidance (can help with noisy gradients)
sigma: 0.0

# Schedule type for rho and mu
# "constant" = same value throughout sampling
# "linear" = linearly decrease toward t=1
rho_schedule: constant
mu_schedule: constant

# Sampling Settings
# -----------------
# These override the checkpoint defaults

# Number of sampling steps (None = use checkpoint default, typically 50)
num_steps: 50

# Classifier-free guidance scale
# Set to 0 to disable CFG and only use TFG
# Set to > 0 to combine CFG + TFG
cfg: 0.0

# Generation Settings
# -------------------
num_images: 16
batch_size: 4
seed: 42

# Classifier Settings
# -------------------
# Which pretrained classifier to use for guidance

# Options: resnet50, resnet101, vit_b_16, vit_l_16
classifier: resnet50

# Maximum gradient norm (for stability)
clip_scale: 1.0

# Model Settings
# --------------
use_ema: true
ema_index: 1
device: cuda

# Evaluation
# ----------
compute_accuracy: true
