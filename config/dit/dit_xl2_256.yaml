# DiT-XL/2 256x256 Configuration
# For baseline inference without TFG guidance

# Model Configuration
model: "DiT-XL/2"
input_size: 32  # Latent size (256 / 8)
patch_size: 2
in_channels: 4  # VAE latent channels
hidden_size: 1152
depth: 28
num_heads: 16
mlp_ratio: 4.0
num_classes: 1000
learn_sigma: true

# DDPM Configuration
num_timesteps: 1000
beta_schedule: "linear"  # "linear" or "cosine"
beta_start: 0.0001
beta_end: 0.02

# Sampling Configuration
num_sampling_steps: 250
sampling_method: "ddpm"  # "ddpm" or "ddim"
cfg_channel_mode: "first3"  # "first3" (Meta original) or "all"

# Classifier-Free Guidance
cfg_scale: 1.5

# VAE Configuration
vae_type: "mse"  # "mse" or "ema"
vae_scale_factor: 0.18215

# Image Configuration
img_size: 256  # Output image size

# Checkpoint Sources
# Option 1: HuggingFace Hub
from_pretrained: "facebook/DiT-XL-2-256"
# Option 2: Local checkpoint (Meta official)
# checkpoint: "checkpoints/DiT-XL-2-256x256.pt"

# Meta official download URL:
# https://dl.fbaipublicfiles.com/DiT/models/DiT-XL-2-256x256.pt
